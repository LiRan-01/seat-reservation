server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/seat?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASS:seat123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  secret: ${APP_SECRET:ccut-seat-demo-secret-2026}
  checkin-window-minutes: 15
  no-show-minutes: 15
  away-max-minutes: 30
  credit-threshold: 60
  violation-score: -5
  checkin-code-minutes: 120

logging:
  level:
    cn.ccut.seat: INFO
